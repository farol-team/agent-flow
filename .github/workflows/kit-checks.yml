name: kit checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kit static invariants (tier 1 — free)
        run: bash tests/kit-invariants.sh
      - name: Kit bin unit tests (tier 1.5 — free)
        run: bash tests/kit-bin.test.sh
      - name: Review and recovery regressions (offline git/process fixtures)
        run: python3 tests/review-gates.test.py
      - name: Review manifest regressions (offline)
        run: python3 tests/review-manifest.test.py
      - name: Claude and Codex executor contracts (offline process fixtures)
        run: python3 tests/executors.test.py
